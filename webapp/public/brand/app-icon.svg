<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Hikaya: berattelsen om resan. Enson - den handmalade zencirkeln - ar
       ramen, malad i papper-vitt pa vagbla botten (samma bla som motorvags-
       skylten). GPS-sparet slingrar in genom ensons oppning, i varselgula
       vagmarkeringsstreck, och slutar i en hinomaru-rod punkt: framme.
       Japansk vibe, vagar och tracker - inga nya farger. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e63e9"/>
      <stop offset="1" stop-color="#11367f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g)"/>

  <!-- Enson: ett penseldrag, oppet nedtill vanster dar sparet gar in.
       Tva arcs pa samma bana med olika bredd ger draget dess ojamna,
       handmalade karaktar; den tunna svansen ar penselns slut. -->
  <path d="M 132 353 A 158 158 0 1 1 216 401"
        fill="none" stroke="#f8f7f3" stroke-width="44" stroke-linecap="round"/>
  <path d="M 216 401 A 158 158 0 0 0 262 412"
        fill="none" stroke="#f8f7f3" stroke-width="24" stroke-linecap="round"/>

  <!-- Sparet: in genom oppningen, genom cirkeln, fram till punkten. -->
  <path d="M 96 512 C 150 460, 130 420, 196 360 S 288 306, 290 248"
        fill="none" stroke="#f0a400" stroke-width="15"
        stroke-dasharray="34 40" stroke-linecap="round"/>

  <!-- Framme: hinomaru, helt innanfor ringen - enson far bara en oppning. -->
  <circle cx="290" cy="212" r="42" fill="#f8f7f3"/>
  <circle cx="290" cy="212" r="23" fill="#e04545"/>
</svg>
