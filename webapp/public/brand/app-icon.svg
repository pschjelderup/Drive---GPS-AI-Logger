<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Hikaya: berattelsen om resan.
       Ensot - den handmalade zencirkeln - ar ramen man ser genom, och
       innanfor den ligger berattelsen sjalv: vagen mot horisonten och den
       roda skivan dar framme, bade hinomaru och "framme".
       Renderad i djup i stallet for platt: natthimmel med dagern uppifran
       vanster, en nedsankt lins, bergen i skikt, mittlinjen i perspektiv.
       Penseldraget ar en fylld form, inte en jamnbred linje, sa att det
       smalnar av mot slutet som ett riktigt drag gor.
       Fargerna ar Hikayas egna: vagbla, papper, varselgult och rott. -->
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3670c6"/>
      <stop offset=".5" stop-color="#173d80"/>
      <stop offset="1" stop-color="#08152f"/>
    </linearGradient>
    <radialGradient id="dager" cx=".28" cy=".2" r=".85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kvall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122c5e"/>
      <stop offset=".62" stop-color="#3b3a72"/>
      <stop offset="1" stop-color="#8a4a5e"/>
    </linearGradient>
    <linearGradient id="papper" x1=".12" y1="0" x2=".88" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#f3f1e8"/>
      <stop offset="1" stop-color="#adb2b8"/>
    </linearGradient>
    <linearGradient id="varsel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#e59200"/>
    </linearGradient>
    <radialGradient id="sol" cx=".36" cy=".32" r=".8">
      <stop offset="0" stop-color="#ff8a72"/>
      <stop offset="1" stop-color="#cf3038"/>
    </radialGradient>
    <linearGradient id="asfalt" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2b3f63"/>
      <stop offset="1" stop-color="#101d38"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".45" stop-color="#ff7a5e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinjett" cx=".5" cy=".45" r=".72">
      <stop offset=".6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".45"/>
    </radialGradient>
    <clipPath id="lins"><circle cx="256" cy="252" r="134"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#himmel)"/>
  <rect width="512" height="512" rx="112" fill="url(#dager)"/>

  <!-- Linsen man ser vagen genom. -->
  <circle cx="256" cy="252" r="134" fill="#0a1228"/>

  <g clip-path="url(#lins)">
    <!-- Kvallshimlen, varmare ner mot horisonten. -->
    <rect x="118" y="114" width="276" height="146" fill="url(#kvall)"/>

    <!-- Solen star fritt ovanfor asen: hinomaru, och malet. Halon ar det
         som gor att den lyser i stallet for att ligga pamalad. -->
    <circle cx="256" cy="206" r="82" fill="url(#halo)"/>
    <circle cx="256" cy="206" r="30" fill="url(#sol)"/>

    <!-- Asen i tva skikt - det bortre ljusare, det ar djupet. -->
    <path d="M118 260 L176 216 L214 244 L262 210 L300 246 L340 220 L394 260 Z"
          fill="#2a4a86" opacity=".85"/>
    <path d="M118 260 L162 238 L206 258 L250 232 L296 258 L342 236 L394 260 Z"
          fill="#0e1a3a"/>

    <!-- Marken och vagen. -->
    <rect x="118" y="258" width="276" height="128" fill="#0b1730"/>
    <path d="M196 386 L250 259 L262 259 L316 386 Z" fill="url(#asfalt)"/>

    <!-- Mittlinjen i perspektiv: strecken kortas och smalnar mot horisonten.
         Det ar perspektivet, inte vagen, som ger djupet. -->
    <g fill="url(#varsel)">
      <path d="M250.5 386 L261.5 386 L260.6 352 L251.4 352 Z"/>
      <path d="M252.0 336 L260.0 336 L259.4 309 L252.6 309 Z"/>
      <path d="M253.1 296 L258.9 296 L258.5 275 L253.5 275 Z"/>
      <path d="M253.9 265 L258.1 265 L257.9 249 L254.1 249 Z"/>
    </g>

    <!-- Vinjett: ljuset faller av mot linsens kant. -->
    <circle cx="256" cy="252" r="134" fill="url(#vinjett)"/>
  </g>

  <!-- Linsens fals och en tunn varselgul rand: nedsankt, inte pamalad. -->
  <circle cx="256" cy="252" r="134" fill="none" stroke="#04091a" stroke-width="9" opacity=".85"/>
  <circle cx="256" cy="252" r="140" fill="none" stroke="url(#varsel)" stroke-width="2.5" opacity=".5"/>

  <!-- Ensot, med sin egen skugga mot himlen. -->
