<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hikaya</title>
    <link rel="icon" type="image/svg+xml" href="/brand/app-icon.svg" />
    <!-- Hemskarmen tar inte svg. Utan de har raderna far ikonen pa telefonen
         vara systemets gravita platshallare, hur fin ikonen an ar i fliken. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Hikaya" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101319" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      // Temat satts fore forsta malningen, annars blinkar sidan till i fel
      // farg vid varje laddning. Tre lagen: ljust, morkt, folj systemet.
      (function () {
        var mode = localStorage.getItem("hikaya-theme") ||
          localStorage.getItem("drivelogger-theme") || "system";
        var dark = mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
