name: Bygg firmware

on:
  # En push till en gren med oppen pull request skulle annars starta tva
  # identiska byggen - ett for pushen och ett for pull requesten. Grenar byggs
  # darfor via pull requesten, och main bygger for sig sjalv eftersom det ar den
  # korningen som publicerar flashsidan.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bygg-${{ github.ref }}
  cancel-in-progress: true

env:
  FQBN: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,FlashMode=qio,PartitionScheme=huge_app,CDCOnBoot=cdc
  SKETCH: firmware/Hikaya

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installera arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # Kortpaketet ar over sju gigabyte, eftersom det innehaller kompilatorer
      # och forkompilerade bibliotek for varje chip i esp32-familjen - inte bara
      # for S3:an vi bygger for. Att hamta det pa nytt vid varje bygge ar den
      # enskilt langsammaste delen av kedjan, sa det sparas mellan korningar.
      # Nyckeln innehaller versionerna nedan, sa en medveten uppgradering ger en
      # ny cache i stallet for en gammal som ser ny ut.
      - name: Aterstall kortpaket ur cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/Arduino/libraries
          key: arduino-esp32-3.3.11-gfx1.6.7-sensorlib0.4.1-ublox3.1.14-lvgl9.3.0

      - name: Installera ESP32-kort och bibliotek
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          # Versionerna ar last med flit. Ett biblioteksbyte ska vara ett
          # medvetet beslut, inte nagot som intraffar for att nagon annan slappte
          # en ny version samma dag som du bygger om.
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install "GFX Library for Arduino"@1.6.7
          arduino-cli lib install "SensorLib"@0.4.1
          arduino-cli lib install "SparkFun u-blox GNSS v3"@3.1.14
          arduino-cli lib install "lvgl"@9.3.0

      - name: Konfigurera arduino-cli
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          echo "--- installerade versioner ---"
          arduino-cli core list
          arduino-cli lib list

      - name: Lagg lvgl-konfigurationen dar biblioteket letar
        run: |
          # LVGL hittar sin lv_conf.h i biblioteksmappens rot, inte i skissen.
          # Skissens kopia ar sanningen; den har laggs dit vid varje bygge sa
          # att en andring i skissen alltid foljer med.
          cp firmware/Hikaya/lv_conf.h ~/Arduino/libraries/lv_conf.h

      - name: Ta reda pa PR-numret
        env:
          # Via miljon, inte direkt i skriptet: en commitrubrik kan innehalla
          # citattecken och dollartecken, och da ska den vara data, inte kod.
          HEAD_MSG: ${{ github.event.head_commit.message }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          # Pa en pull request ar numret givet. Pa main star det i
          # merge-commitens rubrik. Hittas inget lamnas det tomt, och skarmen
          # visar da bara versionen.
          PR="$EVENT_PR"
          if [ -z "$PR" ]; then
            PR=$(printf '%s' "$HEAD_MSG" | head -1 | sed -n 's/^Merge pull request #\([0-9]\+\).*/\1/p')
          fi
          echo "FW_PR=$PR" >> "$GITHUB_ENV"
          echo "pr-nummer: '$PR'"

      - name: Kompilera
        run: |
          VERSION="${GITHUB_SHA::7}"
          # Versionen och PR-numret bakas in i firmware, sa att MENY kan visa
          # vad som faktiskt sitter pa kortet. Utan dem gar det inte att se om
          # en flashning tog, och det ar den forsta fragan nar nagot beter sig
          # gammalt. "b534928 PR8" pekar dessutom ut precis vilken andring det
          # var.
          #
          # Tva kort, tva byggen: AMOLED 2.41 (utan flagga) och LCD 3.5
          # (-DBOARD_LCD35). Samma kallkod, olika pinnar och skala.
          for VAR in 241 35; do
            EXTRA=""
            [ "$VAR" = "35" ] && EXTRA=" -DBOARD_LCD35"
            arduino-cli compile \
              --fqbn "$FQBN" \
              --output-dir "build-$VAR" \
              --warnings default \
              --build-property "compiler.cpp.extra_flags=-DFW_VERSION=\"$VERSION\" -DFW_PR=\"$FW_PR\"$EXTRA" \
              "$SKETCH"
          done
          ls -la build-241 build-35

          # Vakt: "skarm: begin" finns bara i 3.5-koden. Skulle byggcachen
          # nagonsin aterandvanda 241-objekten for 35-bygget (eller tvartom)
          # ser binarerna hela ut men kor fel kort - och skarmen blir svart
          # utan ett enda felmeddelande. Det har ar raden som fangar det.
          if ! strings build-35/Hikaya.ino.bin | grep -q "skarm: begin"; then
            echo "FEL: 35-binaren saknar 3.5-koden (byggcache?)" >&2
            exit 1
          fi
          if strings build-241/Hikaya.ino.bin | grep -q "skarm: begin"; then
            echo "FEL: 241-binaren innehaller 3.5-koden (byggcache?)" >&2
            exit 1
          fi

      - name: Sla ihop till flashbara delar
        run: |
          # Versionen ar last av samma skal som biblioteken ar det. Utan las
          # hamtas senaste esptool vid varje bygge, och den dagen en majorversion
          # tar bort ett flaggnamn slutar bygget fungera utan att nagon rort
          # koden. Ett trasigt bygge ska ha en orsak man kan peka pa.
          python3 -m pip install --quiet esptool==5.3.1

          BOOT_APP0=$(find "$HOME/.arduino15/packages/esp32" -name boot_app0.bin | head -1)
          echo "boot_app0: $BOOT_APP0"

          # Tva delar per kort, inte en: delarna lamnar ett hal over nvs-omradet
          # 0x9000-0xE000, sa installningar, tara och resenumret overlever varje
          # omflashning. Filnamnen innehaller byggets id sa att webblasarens
          # cache aldrig kan flasha en gammal firmware.
          VERSION="${GITHUB_SHA::7}"
          mkdir -p site

          for VAR in 241 35; do
            python3 -m esptool --chip esp32s3 merge-bin \
              -o "site/hikaya-$VAR-$VERSION-a.bin" \
              --flash-mode dio \
              --flash-freq 80m \
              --flash-size 16MB \
              0x0 "build-$VAR/Hikaya.ino.bootloader.bin" \
              0x8000 "build-$VAR/Hikaya.ino.partitions.bin"

            python3 -m esptool --chip esp32s3 merge-bin \
              -o "site/hikaya-$VAR-$VERSION-b.bin" \
              --target-offset 0xe000 \
              --flash-mode dio \
              --flash-freq 80m \
              --flash-size 16MB \
              0xe000 "$BOOT_APP0" \
              0x10000 "build-$VAR/Hikaya.ino.bin"

            # Halet maste finnas. Vaxer del A in i 0x9000 ar nvs inte skyddat,
            # och det ska falla bygget har.
            SIZE_A=$(stat -c%s "site/hikaya-$VAR-$VERSION-a.bin")
            echo "kort $VAR del A: $SIZE_A byte, nvs borjar vid 36864"
            if [ "$SIZE_A" -gt 36864 ]; then
              echo "FEL: del A vaxer in i nvs-omradet" >&2
              exit 1
            fi
          done

          ls -la site

      - name: Bygg flashsidan
        run: |
          VERSION="${GITHUB_SHA::7}"
          # Tiden stamplas maskinlasbart och gors om till lasarens egen tidszon
          # av sidan. Da star den i svensk tid for den som ar i Sverige, utan
          # att bygget behover veta nagot om sommartid.
          BUILT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          for f in index.html manifest-241.json manifest-35.json; do
            sed -e "s/__VERSION__/$VERSION/g" -e "s/__BUILT__/$BUILT/g" \
              -e "s/__PR__/$FW_PR/g" \
              "web/$f" > "site/$f"
          done
          echo "--- manifesten ---"
          cat site/manifest-241.json site/manifest-35.json
          # Ett stavfel i en platshallare skulle annars ge en sida som ser hel ut
          # men laddar ner en fil som inte finns.
          if grep -q '__VERSION__\|__BUILT__\|__PR__' site/index.html site/manifest-241.json site/manifest-35.json; then
            echo "FEL: platshallare kvar i den publicerade sidan" >&2
            exit 1
          fi
          for VAR in 241 35; do
            test -f "site/hikaya-$VAR-$VERSION-a.bin"
            test -f "site/hikaya-$VAR-$VERSION-b.bin"
          done

      - name: Spara firmware som nedladdningsbar artefakt
        # Ett fullt lagringsutrymme for artefakter ar ett kontoproblem, inte ett
        # fel i koden. Bygget ska inte rapporteras som trasigt for det -
        # flashsidan hamtar sin fil harifran och den byggdes klart.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hikaya-firmware-${{ github.sha }}
          path: site/hikaya-*.bin
          if-no-files-found: error
          retention-days: 7

      - name: Paketera flashsidan
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicera:
    # Lagger flashsidan pa natet sa att firmware kan installeras med ett klick.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
